version: "3.9"
services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - db
      - redis
    command: sh -c "npx prisma migrate deploy && npm run start"

  db:
    image: postgres:16
    environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: aiagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build: .
    env_file: .env
    depends_on:
      - db
      - redis
    command: node dist/worker/index.js

volumes:
  pgdata:
